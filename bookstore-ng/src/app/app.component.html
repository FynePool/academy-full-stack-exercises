<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../favicon.ico">
  <title>SpringBoot Home</title>
</head>

<body class="vsc-initialized">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand">MyAngularPJ</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation" style="margin-right: 0px;">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" [routerLink]="['/home']" [routerLinkActive]="['warningBG']">
              Home
            </a>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" [routerLink]="['/authors']" [routerLinkActive]="['warningBG']">
              Authors
            </a>
          </li>
        </ul>
        <form class="d-flex" #form="ngForm" (ngSubmit)="submit(form)">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name="searchString" [(ngModel)]="searchString">
          <button class="btn btn-outline-warning" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <main role="main" class="container">
    <div class="starter-template">
      <router-outlet></router-outlet>
    </div>
  </main>

</body>

</html>
