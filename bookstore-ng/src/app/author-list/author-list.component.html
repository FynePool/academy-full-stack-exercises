<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
  <div>
    <!-- style="width: 500px;"-->
    <h1 style="text-align: left;">Authors:</h1>
    <table class="table table-striped table-dark" style="vertical-align: middle;">
      <thead class="thead-dark" style="text-align: center;">
        <tr>
          <th>
            <form class="d-flex" #form="ngForm" (ngSubmit)="submitSearchAuthors(form)">
              <input class="form-control me-2" type="search" placeholder="First Name" aria-label="Search"
                name="searchFN" [(ngModel)]="searchFN">
              <input class="form-control me-2" type="search" placeholder="Last Name" aria-label="Search" name="searchLN"
                [(ngModel)]="searchLN">
              <input class="form-control me-2" type="search" placeholder="ID" aria-label="Search" name="searchID"
                [(ngModel)]="searchID">
              <button class="btn btn-outline-warning" type="submit">Search</button>
            </form>
          </th>
        </tr>
      </thead>
    </table>
    <table class="table table-striped table-dark" style="vertical-align: middle;">
      <thead class="thead-dark" style="text-align: center;">
        <tr>
          <th scope="col">ID</th>
          <th scope="col">First Name</th>
          <th scope="col">Last Name</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody style="text-align: center;">
        <tr *ngFor="let author of authorsList; index as i">
          <th scope="row">{{author.id}}</th>
          <td>{{author.firstName}}</td>
          <td>{{author.lastName}}</td>
          <td>
            <div class="btn-group btn-group-sm" style="border-color: black;">
              <button type="button" class="btn btn-primary">Books</button>
              <button type="button" class="btn btn-success" data-bs-toggle="modal"
                data-bs-target="#modifyModal">Modify</button>
              <button type="button" class="btn btn-danger" (click)="deleted.emit(author)">Delete</button>
              <button type="button" class="btn btn-warning" (click)="info.emit(author)">
                <a [routerLink]="['/authors', author.id]" style="text-decoration: none; color: white;">Info</a>
              </button>
            </div>
          </td>
      </tbody>
    </table>
    <div *ngIf="inSearch" style="text-align: center;">
      <table class="table table-striped table-dark" style="vertical-align: middle;">
        <thead class="thead-dark" style="text-align: center;">
          <tr>
            <th>
              <button type="button" class="btn btn-warning" (click)="backToFullList()"
                style="border-color: black; margin: auto;">Back to full list</button>
            </th>
          </tr>
        </thead>
      </table>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="modifyModal" tabindex="-1" role="dialog" aria-labelledby="modifyModalLabel"
      aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modifyModalLabel">Edit author:</h5>
          </div>
          <div class="modal-body">
            <form class="d-flex" #formEdit="ngForm" (ngSubmit)="submitEditAuthors(formEdit)">
              <input class="form-control me-2" type="search" placeholder="First Name" aria-label="Search"
                name="editFN" [(ngModel)]="editFN">
              <input class="form-control me-2" type="search" placeholder="Last Name" aria-label="Search" name="editLN"
                [(ngModel)]="editLN">
              <input class="form-control me-2" type="search" placeholder="ID" aria-label="Search" name="editID"
                [(ngModel)]="editID">
              <button class="btn btn-outline-warning" type="submit" data-bs-dismiss="modal">Submit</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

<script src="./Starter Template for Bootstrap_files/jquery-3.3.1.slim.min.js.download"
  integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script>window.jQuery || document.write('<script src="../../assets/js/vendor/jquery-slim.min.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>


</html>
